name: Dependency security

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install and verify server lockfile
        working-directory: server
        run: npm ci
      - name: Install and verify web lockfile
        working-directory: web
        run: npm ci
      - name: Audit dependencies
        run: node .github/scripts/audit-dependencies.mjs
      - name: Scan tracked files for obvious secrets
        run: node .github/scripts/check-secrets.mjs
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install backend
        working-directory: server
        run: npm ci
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Backend TypeScript check
        working-directory: server
        run: npm run build
      - name: Backend lint
        working-directory: server
        run: npm run lint
      - name: Frontend TypeScript check
        working-directory: web
        run: npx tsc --noEmit
      - name: Frontend lint
        working-directory: web
        run: npm run lint
      - name: Security architecture regressions
        working-directory: server
        run: npx vitest run tests/securityArchitecture.test.ts tests/mongoConnection.test.ts tests/webSecurity.test.ts tests/stripeWebhookSignature.test.ts tests/artworkFileType.test.ts
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Backend production build
        working-directory: server
        run: npm run build
      - name: Frontend production build
        working-directory: web
        run: npm run build
      - name: Backend production audit
        working-directory: server
        run: npm audit --omit=dev
      - name: Frontend production audit
        working-directory: web
        run: npm audit --omit=dev
